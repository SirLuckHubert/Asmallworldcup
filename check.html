<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site check — aSmallWorldCup</title>
<link rel="stylesheet" href="style.css?v=2026-09-25c">
<style>
  /* deliberately self-contained: this page has to be readable even if style.css is wrong */
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #06100a; color: #e8f2ea; }
  .box { max-width: 900px; margin: 30px auto; padding: 22px; border: 1px solid #2c5b3d; border-radius: 14px; background: #0a1a10; }
  h1 { font: 800 22px/1.3 system-ui, sans-serif; margin: 0 0 4px; }
  p.sub { color: #8fae99; font: 400 14px/1.5 system-ui, sans-serif; margin: 0 0 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 9px 8px; border-bottom: 1px solid #1d3c28; vertical-align: top; }
  td:first-child { color: #8fae99; width: 230px; }
  .ok { color: #46e58a; font-weight: 700; }
  .bad { color: #ff6b5e; font-weight: 700; }
  .warn { color: #ffd23f; font-weight: 700; }
  code { color: #bfe6cd; word-break: break-all; }
  .hint { margin-top: 18px; font: 400 14px/1.6 system-ui, sans-serif; color: #b9d3c1; }
  .hint b { color: #fff; }
</style>
</head>
<body>
<div class="box">
  <h1>aSmallWorldCup — site check</h1>
  <p class="sub">Open this page on the live site. Everything below is what the browser actually sees.</p>
  <table id="rows"></table>
  <div class="hint" id="hint"></div>
</div>

<script>
const EXPECTED_BUILD = "2026-09-25c";
const rows = document.getElementById("rows");
const hints = [];

function row(label, value, state) {
  const tr = document.createElement("tr");
  const a = document.createElement("td");
  a.textContent = label;
  const b = document.createElement("td");
  if (state) {
    const tag = document.createElement("span");
    tag.className = state;
    tag.textContent = state === "ok" ? "OK " : state === "bad" ? "PROBLEM " : "CHECK ";
    b.appendChild(tag);
  }
  const code = document.createElement("code");
  code.textContent = value;
  b.appendChild(code);
  tr.append(a, b);
  rows.appendChild(tr);
}

async function head(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    const body = r.ok ? await r.blob() : null;
    return { ok: r.ok, status: r.status, size: body ? body.size : 0 };
  } catch (err) {
    return { ok: false, status: err.message || "network error", size: 0 };
  }
}

(async function () {
  row("page URL", location.href);
  row("folder the site runs from", new URL(".", location.href).pathname);

  // ---- stylesheet
  const build = getComputedStyle(document.documentElement).getPropertyValue("--build").trim().replace(/"/g, "");
  if (build === EXPECTED_BUILD) {
    row("style.css in use", "build " + build, "ok");
  } else if (build) {
    row("style.css in use", "build " + build + "  (expected " + EXPECTED_BUILD + ")", "warn");
    hints.push("An <b>older style.css</b> is live. Re-upload it, then hard refresh (Ctrl+Shift+R).");
  } else {
    row("style.css in use", "no --build marker: old file or not loaded", "bad");
    hints.push("The stylesheet is <b>old or missing</b>. Make sure <code>style.css</code> sits next to " +
               "<code>index.html</code> in the repo, then hard refresh (Ctrl+Shift+R).");
  }
  const css = await head("style.css?cachebust=" + Date.now());
  row("style.css fetched", css.status + " · " + css.size + " bytes",
      css.ok && css.size > 20000 ? "ok" : "bad");

  // ---- scripts
  for (const f of ["app.js", "firebase-config.js", "cards.json",
                   "play.html", "play.js", "net.js", "ranks.js", "words.js"]) {
    const r = await head(f + "?cachebust=" + Date.now());
    row(f, r.status + " · " + r.size + " bytes", r.ok ? "ok" : "bad");
    if (!r.ok) hints.push("<b>" + f + "</b> is missing from the repo root.");
  }

  // ---- the game build
  let gamePath = "game/index.html";
  try {
    const cfg = await import("./firebase-config.js?cachebust=" + Date.now());
    gamePath = cfg.GAME_PATH || gamePath;
    row("GAME_PATH", gamePath);
    row("admin email", cfg.ADMIN_EMAIL || "(not set)", cfg.ADMIN_EMAIL ? "ok" : "bad");
    const key = (cfg.firebaseConfig || {}).apiKey || "";
    row("firebase project", (cfg.firebaseConfig || {}).projectId || "(not set)",
        key && !key.startsWith("PASTE") ? "ok" : "bad");
  } catch (err) {
    row("firebase-config.js", "could not load: " + err.message, "bad");
  }

  const game = await head(gamePath + "?cachebust=" + Date.now());
  row(gamePath, game.status + " · " + game.size + " bytes", game.ok ? "ok" : "bad");
  if (!game.ok) {
    hints.push("The game page isn't where the site expects it. Upload the pygbag build so that " +
               "<b>" + gamePath + "</b> resolves from this folder.");
  }
  const dir = gamePath.replace(/[^/]+$/, "");
  for (const f of ["aswc.apk", "favicon.png", "bridge.js"]) {
    const r = await head(dir + f + "?cachebust=" + Date.now());
    row(dir + f, r.status + " · " + r.size + " bytes",
        r.ok ? "ok" : (f === "bridge.js" ? "warn" : "bad"));
    if (!r.ok && f === "bridge.js") {
      hints.push("<b>bridge.js</b> is missing from the game folder — the game will run but progress " +
                 "won't sync to the cloud. Re-run build_web.sh and upload the game folder again.");
    }
    if (!r.ok && f === "aswc.apk") {
      hints.push("<b>aswc.apk</b> is missing — that's the game itself. Upload the whole build folder.");
    }
  }

  // ---- does the game page hook the bridge?
  if (game.ok) {
    try {
      const html = await (await fetch(gamePath + "?cachebust=" + Date.now(), { cache: "no-store" })).text();
      row("bridge.js hooked into the game page", html.includes("bridge.js") ? "yes" : "no",
          html.includes("bridge.js") ? "ok" : "warn");
      if (!html.includes("bridge.js")) {
        hints.push("The game page doesn't load <b>bridge.js</b>, so saves stay in this browser only. " +
                   "build_web.sh adds it; if you built by hand, add " +
                   "<code>&lt;script src=\"bridge.js\"&gt;&lt;/script&gt;</code> before &lt;/head&gt;.");
      }
    } catch (err) { /* ignore */ }
  }

  const jekyll = await head(".nojekyll?cachebust=" + Date.now());
  row(".nojekyll", jekyll.ok ? "present" : "missing", jekyll.ok ? "ok" : "warn");
  if (!jekyll.ok) hints.push("Add an empty <b>.nojekyll</b> file at the repo root so GitHub serves every " +
                             "file in the build untouched.");

  document.getElementById("hint").innerHTML = hints.length
    ? "<b>What to do:</b><ul><li>" + hints.join("</li><li>") + "</li></ul>"
    : "<b>Everything checks out.</b> If the game still doesn't show, open the game page directly " +
      "(" + gamePath + ") and send the browser console output.";
})();
</script>
</body>
</html>
