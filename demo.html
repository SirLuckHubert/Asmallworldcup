<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>aSmallWorldCup - World Cup demo</title>
<meta name="theme-color" content="#050b18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23000'/><circle cx='16' cy='16' r='9' fill='%23fff'/><path d='M16 9l4 3-1.5 5h-5L12 12z' fill='%23000'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* The game owns the window: nothing on top of it but the fullscreen button. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Barlow", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; background: #000; touch-action: none; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* the one piece of chrome */
  #fs {
    position: fixed; top: 12px; right: 12px; z-index: 6;
    width: 42px; height: 42px;
    display: grid; place-content: center;
    font: 700 17px/1 "Archivo", system-ui, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, .55);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 11px;
    cursor: pointer;
    opacity: .35;
    transition: opacity .2s, box-shadow .2s, background .2s;
  }
  #fs:hover, #fs:focus-visible {
    opacity: 1;
    background: rgba(0, 0, 0, .8);
    box-shadow: 0 0 22px -4px rgba(255, 255, 255, .55);
    outline: none;
  }
  body.fs-on #fs { opacity: .18; }

  /* a 16:9 pitch in a tall phone is a letterbox strip - say so */
  #turn { display: none; }
  @media (max-width: 820px) and (orientation: portrait) {
    #turn {
      position: fixed; inset: 0; z-index: 8;
      display: grid; place-content: center; justify-items: center; gap: 14px;
      background: rgba(0, 0, 0, .88);
      text-align: center; padding: 30px;
    }
    #turn p { color: #a9adb4; margin: 0; max-width: 30ch; line-height: 1.6; }
    #turn .phone {
      width: 54px; height: 88px; border: 3px solid #fff; border-radius: 10px;
      animation: tilt 2.4s ease-in-out infinite;
    }
    @keyframes tilt { 0%, 45% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  }

  /* only shows when something actually goes wrong */
  #note {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
    padding: 9px 16px; border-radius: 10px;
    background: rgba(0, 0, 0, .8);
    border: 1px solid rgba(255, 255, 255, .22);
    box-shadow: 0 0 26px -8px rgba(255, 255, 255, .4);
    font-size: 13px; color: #fff;
  }

  /* sign-in / banned / loading, centred over the black */
  .pane {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-content: center; justify-items: center; gap: 16px;
    text-align: center; padding: 26px;
    background:
      linear-gradient(180deg, transparent 72%, rgba(27, 111, 53, .55) 72%, rgba(18, 74, 37, .8)),
      radial-gradient(circle at 50% 30%, #1a2a58, #050b18 70%);
  }
  .pane h1 { font: italic 900 clamp(30px, 5vw, 52px)/1 "Barlow Condensed", Impact, sans-serif; text-transform: uppercase; margin: 0; }
  .pane p { color: #a3b3d4; max-width: 46ch; margin: 0; line-height: 1.6; }
  .pane .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pane button, .pane a.btn {
    font: 800 18px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: linear-gradient(180deg, #43d46c, #2fbf5a 55%, #22a14a);
    border: 2px solid rgba(255, 255, 255, .85); border-radius: 12px; padding: 13px 22px; cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 0 #157a34, 0 10px 30px -10px rgba(47, 191, 90, .8);
  }
  .pane a.ghost, .pane button.ghost {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.24); box-shadow: none;
  }
  .pane .google { background: #fff; color: #1f1f1f; display: inline-flex; align-items: center; gap: 10px; border: 0; box-shadow: none;
                  font: 700 16px/1 "Barlow", system-ui, sans-serif; letter-spacing: 0; text-transform: none; }
  .pane .google svg { width: 18px; height: 18px; }
  .spin { width: 46px; height: 46px; animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #back {
    position: fixed; top: 12px; left: 12px; z-index: 6;
    padding: 0 14px; height: 42px; display: grid; place-content: center;
    font: 800 15px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    color: #fff; text-decoration: none; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.22); border-radius: 11px; opacity: .35; transition: opacity .2s;
  }
  #back:hover, #back:focus-visible { opacity: 1; outline: none; }
</style>
</head>
<body>

<div id="stage"></div>

<a id="back" href="index.html" title="Sign in on the site for the full game">← Full game</a>
<button id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>

<div id="turn">
  <div class="phone"></div>
  <p>Turn your phone sideways — the pitch is a wide one.</p>
</div>

<!-- the demo needs no account: World Cup mode only, saved in this browser -->
<div class="pane" id="loading">
  <svg class="spin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff"/><path d="M16 6l6 4.4-2.3 7.1h-7.4L10 10.4z" fill="#000"/></svg>
  <h1 id="loadTitle">World Cup demo</h1>
  <p id="loadNote">No sign-in needed. Pick a nation and win all 7 rounds. Your run is saved in this browser only.</p>
  <div class="row"><a class="btn ghost" href="index.html">Back to the site</a></div>
</div>

<script>
(function () {
  var stage = document.getElementById("stage"), loading = document.getElementById("loading");
  var frame = document.createElement("iframe");
  frame.title = "aSmallWorldCup - World Cup demo";
  frame.allow = "autoplay; fullscreen; gamepad";
  frame.setAttribute("allowfullscreen", "");
  frame.src = "game/index.html?demo=1";
  frame.onload = function () { loading.hidden = true; };
  stage.appendChild(frame);
  setTimeout(function () {
    if (!loading.hidden) document.getElementById("loadNote").textContent = "Still loading… (big download the first time)";
  }, 9000);
  document.getElementById("fs").onclick = function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  };
  document.addEventListener("fullscreenchange", function () {
    document.body.classList.toggle("fs-on", !!document.fullscreenElement);
  });
})();
</script>
</body>
</html>
